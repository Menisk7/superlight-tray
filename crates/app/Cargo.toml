[package]
name = "superlight-tray"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Tray app for the Logitech PRO X Superlight: battery level and DPI"
authors = ["Menisk7"]

[[bin]]
name = "superlight-tray"
path = "src/main.rs"

[dependencies]
hidpp = { path = "../hidpp" }
hidapi = { version = "2.6", default-features = false, features = ["linux-native-basic-udev"] }
log = "0.4"
simplelog = "0.12"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
directories = "6"
crossbeam-channel = "0.5"

[target.'cfg(windows)'.dependencies]
tray-icon = "0.21"
winreg = "0.55"
windows-sys = { version = "0.60", features = [
  "Win32_Foundation",
  "Win32_System_Console",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Security",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_UI_Controls",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
] }

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }
notify-rust = "4"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[package.metadata.deb]
name = "superlight-tray"
maintainer = "Menisk7"
copyright = "2026, Menisk7"
license-file = ["../../LICENSE", "0"]
extended-description = "System tray app for the Logitech PRO X Superlight: shows the battery level on the tray icon, changes DPI from the tray menu and can save it into the mouse's onboard memory with automatic backup and verification."
section = "utils"
priority = "optional"
depends = "libc6 (>= 2.28)"
recommends = "gnome-shell-extension-appindicator | plasma-workspace | xfce4-statusnotifier-plugin"
maintainer-scripts = "../../packaging/linux/scripts/"
assets = [
  ["target/release/superlight-tray", "usr/bin/", "755"],
  ["../../packaging/linux/60-superlight-tray.rules", "usr/lib/udev/rules.d/", "644"],
  ["../../packaging/linux/superlight-tray.desktop", "usr/share/applications/", "644"],
  ["../../README.md", "usr/share/doc/superlight-tray/README.md", "644"],
]

[package.metadata.generate-rpm]
name = "superlight-tray"
summary = "Tray app for the Logitech PRO X Superlight: battery and DPI"
license = "MIT"
post_install_script = "../../packaging/linux/scripts/postinst"
post_uninstall_script = "../../packaging/linux/scripts/postrm"
assets = [
  { source = "target/release/superlight-tray", dest = "/usr/bin/superlight-tray", mode = "755" },
  { source = "../../packaging/linux/60-superlight-tray.rules", dest = "/usr/lib/udev/rules.d/60-superlight-tray.rules", mode = "644" },
  { source = "../../packaging/linux/superlight-tray.desktop", dest = "/usr/share/applications/superlight-tray.desktop", mode = "644" },
  { source = "../../README.md", dest = "/usr/share/doc/superlight-tray/README.md", mode = "644", doc = true },
]
